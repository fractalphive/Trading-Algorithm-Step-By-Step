<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="670" viewBox="0 0 1040 670" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <marker id="arrowRose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#020617" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Header -->
  <text x="40" y="40" fill="#e2e8f0" font-size="18" font-weight="700">DCA Algo — Episode 1: Fresh Start</text>
  <text x="40" y="62" fill="#94a3b8" font-size="11">From a blank Linux VM to a runnable alpaca-py script that places a paper order for 1 share of SPY</text>

  <!-- ===================== ARROWS (drawn first, behind boxes) ===================== -->
  <!-- Free AI -> VS Code -->
  <path d="M 230 130 L 156 213" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="175" fill="#94a3b8" font-size="9">writes code</text>

  <!-- Obsidian -> .env (secret delivery, rose dashed) -->
  <path d="M 460 130 C 600 130, 720 250, 635 428" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowRose)"/>
  <text x="600" y="200" fill="#fb7185" font-size="9">key / secret</text>

  <!-- venv -> code.py -->
  <path d="M 155 370 L 300 393" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
  <text x="160" y="392" fill="#94a3b8" font-size="9">runs in</text>

  <!-- alpaca-py -> code.py -->
  <path d="M 245 435 L 288 360" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
  <text x="250" y="418" fill="#94a3b8" font-size="9">import</text>

  <!-- VS Code -> code.py -->
  <path d="M 155 275 L 368 318" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="300" fill="#94a3b8" font-size="9">edit / run</text>

  <!-- .env -> code.py (load_dotenv) -->
  <path d="M 540 467 L 452 367" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowRose)"/>
  <text x="470" y="430" fill="#fb7185" font-size="9">load_dotenv()</text>

  <!-- code.py -> Alpaca TradingClient (submit order) -->
  <path d="M 450 340 C 600 340, 660 255, 838 255" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="600" y="325" fill="#fbbf24" font-size="9">submit market order: 1 SPY</text>

  <!-- Alpaca internal -->
  <path d="M 915 290 L 915 348" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="925" y="322" fill="#94a3b8" font-size="9">routes</text>
  <path d="M 915 420 L 915 478" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
  <text x="925" y="452" fill="#34d399" font-size="9">accepted</text>

  <!-- ===================== BOUNDARIES ===================== -->
  <!-- Fresh Linux VM -->
  <rect x="40" y="180" width="430" height="400" rx="12" fill="rgba(30,41,59,0.12)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="55" y="200" fill="#94a3b8" font-size="10" font-weight="600">Fresh Linux VM (Ubuntu)</text>

  <!-- Alpaca Paper Trading -->
  <rect x="820" y="180" width="190" height="400" rx="12" fill="rgba(120,53,15,0.05)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="835" y="200" fill="#fbbf24" font-size="10" font-weight="600">Alpaca — Paper Trading</text>

  <!-- Secrets security group -->
  <rect x="525" y="413" width="225" height="115" rx="8" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="533" y="429" fill="#fb7185" font-size="8">Secrets — gitignored</text>

  <!-- ===================== COMPONENTS ===================== -->
  <!-- Free AI Chat (External) -->
  <rect x="40" y="100" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="40" y="100" width="190" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="128" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Free AI Chat</text>
  <text x="135" y="144" fill="#94a3b8" font-size="9" text-anchor="middle">code generation</text>

  <!-- Obsidian Notes (External) -->
  <rect x="270" y="100" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="270" y="100" width="190" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="365" y="128" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Obsidian Notes</text>
  <text x="365" y="144" fill="#94a3b8" font-size="9" text-anchor="middle">stores key / secret</text>

  <!-- VS Code (Frontend/IDE) -->
  <rect x="65" y="215" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="65" y="215" width="180" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="155" y="243" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">VS Code</text>
  <text x="155" y="259" fill="#94a3b8" font-size="9" text-anchor="middle">IDE + terminal</text>

  <!-- Python 3 + venv (Backend) -->
  <rect x="65" y="310" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="65" y="310" width="180" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="155" y="338" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Python 3 + venv</text>
  <text x="155" y="354" fill="#94a3b8" font-size="9" text-anchor="middle">myenv (isolated)</text>

  <!-- alpaca-py SDK (Backend) -->
  <rect x="65" y="405" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="65" y="405" width="180" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="155" y="433" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">alpaca-py SDK</text>
  <text x="155" y="449" fill="#94a3b8" font-size="9" text-anchor="middle">pip install alpaca-py</text>

  <!-- code.py (Backend, central) -->
  <rect x="290" y="320" width="160" height="75" rx="6" fill="#0f172a"/>
  <rect x="290" y="320" width="160" height="75" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="370" y="350" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">code.py</text>
  <text x="370" y="367" fill="#94a3b8" font-size="9" text-anchor="middle">connect + order</text>
  <text x="370" y="383" fill="#34d399" font-size="8" text-anchor="middle">TradingClient</text>

  <!-- .env (Security) -->
  <rect x="540" y="430" width="190" height="75" rx="6" fill="#0f172a"/>
  <rect x="540" y="430" width="190" height="75" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="635" y="458" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">.env</text>
  <text x="635" y="475" fill="#94a3b8" font-size="8" text-anchor="middle">ALPACA_API_KEY</text>
  <text x="635" y="489" fill="#94a3b8" font-size="8" text-anchor="middle">ALPACA_SECRET_KEY</text>
  <text x="635" y="501" fill="#fb7185" font-size="8" text-anchor="middle">PAPER=true</text>

  <!-- Alpaca: TradingClient API -->
  <rect x="840" y="220" width="150" height="70" rx="6" fill="#0f172a"/>
  <rect x="840" y="220" width="150" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="915" y="248" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">TradingClient</text>
  <text x="915" y="264" fill="#94a3b8" font-size="9" text-anchor="middle">REST / SDK API</text>
  <text x="915" y="280" fill="#fbbf24" font-size="8" text-anchor="middle">paper endpoint</text>

  <!-- Alpaca: Paper Dashboard -->
  <rect x="840" y="350" width="150" height="70" rx="6" fill="#0f172a"/>
  <rect x="840" y="350" width="150" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="915" y="378" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Paper Dashboard</text>
  <text x="915" y="394" fill="#94a3b8" font-size="9" text-anchor="middle">Orders view</text>
  <text x="915" y="410" fill="#fbbf24" font-size="8" text-anchor="middle">source: access key</text>

  <!-- Alpaca: Order 1 SPY accepted -->
  <rect x="840" y="480" width="150" height="70" rx="6" fill="#0f172a"/>
  <rect x="840" y="480" width="150" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="915" y="508" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Order: 1 SPY</text>
  <text x="915" y="524" fill="#94a3b8" font-size="9" text-anchor="middle">market order</text>
  <text x="915" y="540" fill="#34d399" font-size="8" text-anchor="middle">Status: accepted</text>

  <!-- ===================== LEGEND ===================== -->
  <text x="40" y="618" fill="#e2e8f0" font-size="10" font-weight="600">Legend</text>
  <rect x="40" y="628" width="14" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="60" y="637" fill="#94a3b8" font-size="9">VS Code (IDE)</text>

  <rect x="200" y="628" width="14" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="220" y="637" fill="#94a3b8" font-size="9">Python · venv · alpaca-py · code.py</text>

  <rect x="520" y="628" width="14" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="540" y="637" fill="#94a3b8" font-size="9">Alpaca Paper (cloud)</text>

  <rect x="720" y="628" width="14" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1"/>
  <text x="740" y="637" fill="#94a3b8" font-size="9">.env secrets</text>

  <rect x="880" y="628" width="14" height="10" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="900" y="637" fill="#94a3b8" font-size="9">External</text>

  <line x1="40" y1="652" x2="60" y2="652" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="68" y="655" fill="#94a3b8" font-size="9">Secret delivery (dashed rose) · Paper trading only — no real money (PAPER=true)</text>
</svg>
